services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartflow-quickbooks
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./migration-reports:/app/migration-reports
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartflow-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:7
    container_name: smartflow-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    networks:
      - smartflow-net
    healthcheck:
      # En el primer arranque rs.status() falla; el catch llama a rs.initiate()
      # y deja el replica set listo. En arranques siguientes solo verifica.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mongo-data:

networks:
  smartflow-net:
    driver: bridge
