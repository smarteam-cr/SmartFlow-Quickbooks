version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartflow-quickbooks
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartflow-net

  mongodb:
    image: mongo:7
    container_name: smartflow-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smartflow-net

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    networks:
      - smartflow-net
    entrypoint: ["sh", "-c"]
    command: >
      mongosh --host mongodb --quiet --eval '
      try {
        rs.status()
      } catch (e) {
        rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })
      }'

volumes:
  mongo-data:

networks:
  smartflow-net:
    driver: bridge