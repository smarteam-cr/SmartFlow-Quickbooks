services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartflow-quickbooks
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - smartflow-net
    volumes:
      - ./logs:/app/logs
      - ./migration-reports:/app/migration-reports
      - ./config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mongodb:
    image: mongo:7
    container_name: smartflow-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - smartflow-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    networks:
      - smartflow-net
    entrypoint:
      - mongosh
      - mongodb://mongodb:27017/?directConnection=true
      - --quiet
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }"
    command: []

volumes:
  mongo-data:

networks:
  smartflow-net:
    driver: bridge