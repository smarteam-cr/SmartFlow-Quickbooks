services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartflow-quickbooks
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./migration-reports:/app/migration-reports
    depends_on:
      - mongodb
    networks:
      - smartflow-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongodb:
    image: mongo:7
    container_name: smartflow-mongo
    restart: unless-stopped
    command: --replSet rs0
    volumes:
      - mongo-data:/data/db
    networks:
      - smartflow-net

volumes:
  mongo-data:

networks:
  smartflow-net:
    driver: bridge